<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Aura Map by Tech Pro</title>
    <meta name="description" content="Thanks for joining the Aura Map waitlist. Tech Pro will reach out when early access is available." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b0e14" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 75% 20%, rgba(79, 70, 229, 0.3), transparent 45%),
          radial-gradient(ellipse at 20% 80%, rgba(6, 182, 212, 0.22), transparent 40%),
          #0b0e14;
        color: #fff;
        font-family: Lato, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(680px, 100%);
        background: rgba(15, 21, 34, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 32px;
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.2);
        border: 1px solid rgba(99, 102, 241, 0.5);
        color: #c7d2fe;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: clamp(30px, 5vw, 44px);
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        font-size: 17px;
        line-height: 1.55;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
      }
      .btn-primary {
        background: #4f46e5;
        color: #fff;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Aura Map • Tech Pro</div>
      <h1>Thank you for signing up.</h1>
      <p>
        You are on the Aura Map waitlist. We will email you when early access opens and when new features are ready.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to Aura Map</a>
        <a class="btn btn-secondary" href="https://auramap.757tech.pro/">Visit Home</a>
      </div>
    </main>
  </body>
</html>
